<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  
  <!-- Apartment Building -->
  <g transform="translate(200, 200)">
    <!-- Building Base -->
    <rect x="100" y="200" width="424" height="424" fill="#FFD700" rx="20"/>
    
    <!-- Building Floors -->
    <!-- Floor 4 (Top) -->
    <rect x="150" y="250" width="80" height="80" fill="#FFFFFF" rx="5"/>
    <rect x="260" y="250" width="80" height="80" fill="#FFFFFF" rx="5"/>
    <rect x="370" y="250" width="80" height="80" fill="#FFFFFF" rx="5"/>
    
    <!-- Floor 3 -->
    <rect x="150" y="360" width="80" height="80" fill="#FFFFFF" rx="5"/>
    <rect x="260" y="360" width="80" height="80" fill="#FFFFFF" rx="5"/>
    <rect x="370" y="360" width="80" height="80" fill="#FFFFFF" rx="5"/>
    
    <!-- Floor 2 -->
    <rect x="150" y="470" width="80" height="80" fill="#FFFFFF" rx="5"/>
    <rect x="260" y="470" width="80" height="80" fill="#FFFFFF" rx="5"/>
    <rect x="370" y="470" width="80" height="80" fill="#FFFFFF" rx="5"/>
    
    <!-- Floor 1 (Ground) with Key Door -->
    <rect x="150" y="580" width="80" height="80" fill="#FFFFFF" rx="5"/>
    <!-- Key as Door (Center) -->
    <g transform="translate(260, 580)">
      <!-- Door with Key -->
      <rect x="0" y="0" width="80" height="80" fill="#333333" rx="5"/>
      <!-- Key Shape -->
      <circle cx="40" cy="25" r="8" fill="#FFD700"/>
      <rect x="36" y="25" width="8" height="25" fill="#FFD700"/>
      <rect x="32" y="45" width="16" height="8" fill="#FFD700"/>
    </g>
    <rect x="370" y="580" width="80" height="80" fill="#FFFFFF" rx="5"/>
  </g>
  
  <!-- Decorative Elements (Optional - can remove for simpler design) -->
  <!-- Small geometric pattern at top -->
  <circle cx="512" cy="150" r="15" fill="#FFD700" opacity="0.3"/>
  <circle cx="450" cy="150" r="10" fill="#FFD700" opacity="0.3"/>
  <circle cx="574" cy="150" r="10" fill="#FFD700" opacity="0.3"/>
</svg>



