# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres.railway.internal:5432/railway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:edkhGKFLEFqJMxtIoicydDtWfAJZgvXp}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# JWT
# ===============================
spring.security.jwt.secret=${JWT_SECRET:ThisIsMySuperSecretJwtKeyForDevelopmentOnly123456789}
spring.security.jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# STORAGE
# ===============================
storage.local-base-path=${STORAGE_BASE_PATH:uploads}
storage.public-url=${STORAGE_PUBLIC_URL:http://localhost:8080/api/files}

# ===============================
# PAYMENT
# ===============================
payment.provider=${PAYMENT_PROVIDER:local}

paystack.secret-key=${PAYSTACK_SECRET_KEY:}

flutterwave.client-id=${FLUTTERWAVE_CLIENT_ID:}
flutterwave.client-secret=${FLUTTERWAVE_CLIENT_SECRET:}
flutterwave.encryption-key=${FLUTTERWAVE_ENCRYPTION_KEY:}

# ===============================
# CORS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ===============================
# POSTMARK
# ===============================
postmark.api-token=${POSTMARK_API_TOKEN:}
postmark.from-email=${POSTMARK_FROM_EMAIL:nigerianapartments@apartifyafrica.site}
postmark.from-name=${POSTMARK_FROM_NAME:Nigerian Apartments}
app.reset-password.url=${RESET_PASSWORD_URL:nigerianapartments://reset-password}

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB

# ===============================
# STATIC RESOURCES
# ===============================
spring.web.resources.add-mappings=false