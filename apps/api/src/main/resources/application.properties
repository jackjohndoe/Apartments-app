# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
server.port=${PORT:8084}

# ===============================
# JWT
# ===============================
spring.security.jwt.secret=${JWT_SECRET:ThisIsMySuperSecretJwtKeyForDevelopmentOnly123456789}
spring.security.jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# STORAGE
# ===============================
storage.local-base-path=${STORAGE_BASE_PATH:uploads}
storage.public-url=${STORAGE_PUBLIC_URL:http://localhost:8080/api/files}

# ===============================
# PAYMENT
# ===============================
payment.provider=${PAYMENT_PROVIDER:local}

paystack.secret-key=${PAYSTACK_SECRET_KEY:}

flutterwave.client-id=${FLUTTERWAVE_CLIENT_ID:}
flutterwave.client-secret=${FLUTTERWAVE_CLIENT_SECRET:}
flutterwave.encryption-key=${FLUTTERWAVE_ENCRYPTION_KEY:}

# ===============================
# KYC / AML COMPLIANCE
# ===============================
kyc.basic-daily-withdrawal-limit=${KYC_BASIC_DAILY_WITHDRAWAL_LIMIT:500000}
kyc.verified-daily-withdrawal-limit=${KYC_VERIFIED_DAILY_WITHDRAWAL_LIMIT:2000000}
kyc.basic-monthly-withdrawal-limit=${KYC_BASIC_MONTHLY_WITHDRAWAL_LIMIT:2000000}
kyc.verified-monthly-withdrawal-limit=${KYC_VERIFIED_MONTHLY_WITHDRAWAL_LIMIT:10000000}
kyc.unverified-daily-deposit-limit=${KYC_UNVERIFIED_DAILY_DEPOSIT_LIMIT:500000}
kyc.basic-daily-deposit-limit=${KYC_BASIC_DAILY_DEPOSIT_LIMIT:1000000}
kyc.verified-daily-deposit-limit=${KYC_VERIFIED_DAILY_DEPOSIT_LIMIT:5000000}
kyc.max-withdrawals-per-hour=${KYC_MAX_WITHDRAWALS_PER_HOUR:3}
kyc.max-withdrawals-per-day=${KYC_MAX_WITHDRAWALS_PER_DAY:10}
kyc.withdrawal-cooldown-after-deposit-minutes=${KYC_WITHDRAWAL_COOLDOWN_MINUTES:5}
kyc.large-single-transaction-threshold=${KYC_LARGE_TRANSACTION_THRESHOLD:1000000}
kyc.require-bank-binding=${KYC_REQUIRE_BANK_BINDING:true}

# ===============================
# CORS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ===============================
# POSTMARK
# ===============================
postmark.api-token=${POSTMARK_API_TOKEN:}
postmark.from-email=${POSTMARK_FROM_EMAIL:nigerianapartments@apartifyafrica.site}
postmark.from-name=${POSTMARK_FROM_NAME:Nigerian Apartments}
app.reset-password.url=${RESET_PASSWORD_URL:nigerianapartments://reset-password}

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB

# ===============================
# STATIC RESOURCES
# ===============================
spring.web.resources.add-mappings=false