# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Backend#5432}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.jwt.secret=ThisIsMySuperSecretJwtKeyForDevelopmentOnly123456789
spring.security.jwt.expiration=${JWT_EXPIRATION:3600000}

storage.local-base-path=${STORAGE_BASE_PATH:uploads}
storage.public-url=${STORAGE_PUBLIC_URL:http://localhost:8080/api/files}

payment.provider=${PAYMENT_PROVIDER:local}

# Paystack Configuration (when payment.provider=paystack)
paystack.secret-key=${PAYSTACK_SECRET_KEY:sk_test_...}

# Flutterwave Configuration (OAuth 2.0)
flutterwave.client-id=${FLUTTERWAVE_CLIENT_ID:}
flutterwave.client-1secret=${FLUTTERWAVE_CLIENT_SECRET:}
flutterwave.encryption-key=${FLUTTERWAVE_ENCRYPTION_KEY:}

server.port=${PORT:8081}

# Static Resource Configuration - Fix for "No static resource api/apartments" error
# This prevents Spring Boot from trying to serve /api/** routes as static files
spring.web.resources.add-mappings=false

# CORS Configuration
# Default: allow all origins (*) for React Native and production
# To restrict to specific origins, set: cors.allowed-origins=http://localhost:8081,https://yourdomain.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=true

# Postmark Configuration
postmark.api-token=${POSTMARK_API_TOKEN:}
postmark.from-email=${POSTMARK_FROM_EMAIL:nigerianapartments@apartifyafrica.site}
postmark.from-name=${POSTMARK_FROM_NAME:Nigerian Apartments}
app.reset-password.url=${RESET_PASSWORD_URL:nigerianapartments://reset-password}

# File Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB
